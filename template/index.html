<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion-styles · studio</title>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; justify-items: center; }
  #out { max-width: 100%; max-height: calc(100vh - 70px); background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; width: min(100%, 1280px); }
  #scrub { flex: 1; } #tt { font-variant-numeric: tabular-nums; min-width: 170px; }
</style>
</head>
<body>
<main>
  <canvas id="out"></canvas>
  <div class="bar"><button id="play">▶︎ / ❚❚</button><input id="scrub" type="range" min="0" max="10" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<!-- config.js is a classic script (Node's music/score.mjs reads it too); main.js is the ES module entry -->
<script src="src/config.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
